# Knobs for the RAG pipeline. Secrets do not belong here — use .env for OPENAI_API_KEY.
# After changing chunking or embedding.model, re-run: python -m src.cli ingest

[chunking]
# Character window size. Larger = more context per chunk, coarser retrieval.
size = 500
# Characters shared by adjacent windows so a fact on a boundary is not split in half.
overlap = 80

[retrieval]
# How many nearest chunks to put in the prompt. 1 is brittle; 20 adds noise.
top_k = 4

[embedding]
# Must be the same model used at ingest and at ask time.
model = "text-embedding-3-small"

[generation]
model = "gpt-4o-mini"
# 0 = copy from notes. Raise slightly (e.g. 0.2) only if answers feel robotic.
temperature = 0.0

[paths]
data_dir = "data"
chroma_path = "chroma_db"
collection_name = "notes"
